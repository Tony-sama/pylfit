<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <title>The observed states of genes A, B and C, by experiment</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="600" height="250" rx="8" fill="#ffffff"/>

  <!-- time axis -->
  <g fill="#666" font-size="13" text-anchor="middle">
    <text x="108" y="26">time 0</text>
    <text x="198" y="26">1</text>
    <text x="288" y="26">2</text>
    <text x="378" y="26">3</text>
    <text x="468" y="26">4</text>
  </g>

  <!-- e1 -->
  <text x="16" y="62" fill="#222" font-size="14">e1</text>
  <g fill="#dbe9f6" stroke="#2c6fad" stroke-width="1.5">
    <rect x="80" y="40" width="56" height="32" rx="4"/>
    <rect x="170" y="40" width="56" height="32" rx="4"/>
    <rect x="260" y="40" width="56" height="32" rx="4"/>
    <rect x="350" y="40" width="56" height="32" rx="4"/>
    <rect x="440" y="40" width="56" height="32" rx="4"/>
  </g>
  <g fill="#222" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
    <text x="108" y="61">000</text>
    <text x="198" y="61">100</text>
    <text x="288" y="61">110</text>
    <text x="378" y="61">111</text>
    <text x="468" y="61">011</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="137" y1="56" x2="168" y2="56"/>
    <line x1="227" y1="56" x2="258" y2="56"/>
    <line x1="317" y1="56" x2="348" y2="56"/>
    <line x1="407" y1="56" x2="438" y2="56"/>
  </g>

  <!-- e2 -->
  <text x="16" y="132" fill="#222" font-size="14">e2</text>
  <g fill="#dbe9f6" stroke="#2c6fad" stroke-width="1.5">
    <rect x="80" y="110" width="56" height="32" rx="4"/>
    <rect x="170" y="110" width="56" height="32" rx="4"/>
  </g>
  <rect x="260" y="110" width="56" height="32" rx="4" fill="#fde8c8" stroke="#c76b00" stroke-width="2"/>
  <g fill="#222" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
    <text x="108" y="131">111</text>
    <text x="198" y="131">011</text>
    <text x="288" y="131">001</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="137" y1="126" x2="168" y2="126"/>
    <line x1="227" y1="126" x2="258" y2="126"/>
  </g>
  <line x1="317" y1="126" x2="348" y2="126" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <rect x="350" y="110" width="56" height="32" rx="4" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="378" y="131" fill="#999" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">?</text>
  <text x="418" y="124" fill="#c76b00" font-size="12">the series ends:</text>
  <text x="418" y="139" fill="#c76b00" font-size="12">next state not seen</text>

  <!-- never observed -->
  <text x="16" y="202" fill="#666" font-size="13">never observed</text>
  <g fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="170" y="180" width="56" height="32" rx="4"/>
    <rect x="260" y="180" width="56" height="32" rx="4"/>
  </g>
  <g fill="#999" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
    <text x="198" y="201">010</text>
    <text x="288" y="201">101</text>
  </g>

  <text x="16" y="238" fill="#666" font-size="12">Each state is A, B, C in order: 110 means A and B on, C off.</text>
</svg>
