  <text x="340" y="74" fill="#222" font-size="12" font-weight="bold">rules for y(1)</text>
  <rect x="340" y="86" width="180" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="348" y="102" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" font-weight="normal" fill="#222">y(1) :- b(1).</text>
  <rect x="340" y="116" width="180" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="348" y="132" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" font-weight="normal" fill="#222">y(1) :- a(0).</text>
  <text x="540" y="74" fill="#222" font-size="12" font-weight="bold">rules for y(0)</text>
  <rect x="540" y="86" width="180" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="548" y="102" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" font-weight="normal" fill="#222">y(0) :- b(0).</text>
  <rect x="540" y="116" width="180" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="548" y="132" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" font-weight="normal" fill="#222">y(0) :- c(0).</text>
  <text x="340" y="166" fill="#666" font-size="11">RuleSetModel counts a match as possible, no more</text>
  <text x="340" y="185" fill="#666" font-size="11">each hidden row matches a rule for 1 and one for 0</text>
  <text x="340" y="204" fill="#a05a00" font-size="11">so all four are ties, broken at random</text>
